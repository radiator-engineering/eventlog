# git-cliff configuration. CHANGELOG.md is generated from commit messages;
# never edit it by hand (decision `changelog`). Regenerate with:
#   git cliff --tag vX.Y.Z -o CHANGELOG.md
[changelog]
header = """
# Changelog

All notable changes to `eventlog` are listed here. This file is generated by
[git-cliff](https://git-cliff.org) from conventional commit messages, which
the commit reactor writes from each `result` event. Do not edit it by hand.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{%- endfor %}
{% endfor %}

"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\s*\(#([0-9]+)\)$', replace = " ([#${1}](https://github.com/radiator-engineering/eventlog/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^build|^react|^view", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test|^style|^chore|^ci", skip = true },
  { message = ".*", group = "<!-- 5 -->Other" },
]
