[package]
name = "eventlog-cli"
version = "0.2.0"
description = "Append-only JSONL coordination log for multi-agent repos: one controller writes, reactors act on events"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
homepage = "https://github.com/radiator-engineering/eventlog"
repository = "https://github.com/radiator-engineering/eventlog"

[[bin]]
name = "eventlog"
path = "src/main.rs"

[lib]
name = "eventlog"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
indexmap = { version = "2", features = ["serde"] }
globset = "0.4"
chrono = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ratatui = "0.29"
crossterm = "0.28"
notify = "6"
include_dir = "0.7"
schemars = "0.8"
anyhow = "1"
ctrlc = { version = "3.5.2", features = ["termination"] }
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# The profile cargo-dist builds release artifacts with (release.yml).
[profile.dist]
inherits = "release"
lto = "fat"

[package.metadata.dist]
# Keep the Homebrew formula named `eventlog` (brew install radiator-engineering/tap/eventlog)
formula = "eventlog"
